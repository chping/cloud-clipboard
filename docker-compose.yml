name: cloud-clipboard

services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./favicon.png:/usr/share/nginx/html/favicon.png:ro
      - ./apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
    depends_on:
      - webdis
    networks:
      npm:
        aliases:
          - cloud-clipboard-web
      backend:

  webdis:
    image: nicolas/webdis:0.1.25
    restart: unless-stopped
    command:
      - /usr/local/bin/webdis
      - /etc/webdis.json
    volumes:
      - ./webdis.json:/etc/webdis.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend

networks:
  npm:
    external: true
    name: nginx_proxy_manager_default
  backend:
    internal: true

volumes:
  redis-data:
